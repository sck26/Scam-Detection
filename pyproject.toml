[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scamguard"
version = "0.1.0"
description = "Phase 0 foundations for ScamGuard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyter>=1.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "ruff>=0.7",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
]
models = [
  "accelerate>=1.1",
  "torch>=2.5",
  "transformers>=4.46",
]
student = [
  "coremltools>=8.1",
  "joblib>=1.4",
  "onnxruntime>=1.20",
  "scikit-learn==1.5.1",
  "skl2onnx>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["ml/src/scamguard"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["ml/src"]
testpaths = ["ml/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["ml/src", "ml/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ml/src", "ml/tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["coremltools.*", "joblib.*", "onnxruntime.*", "skl2onnx.*"]
ignore_missing_imports = true
